name: Fix fog shader scope
on:
  push:
    branches: [codex/claude-pass]
    paths: [.github/workflows/codex-fix-fog.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
      - name: Fix WorldPush scope in fog helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shaders/pipelines/world/fog.slang')
          s = p.read_text()
          s = s.replace('float3 fogLocalLightInscatter(float3 position) {', 'float3 fogLocalLightInscatter(WorldPush push, float3 position) {')
          s = s.replace('|| worldPush.lightCount == 0u)', '|| push.lightCount == 0u)')
          s = s.replace('span.firstLight >= worldPush.lightCount', 'span.firstLight >= push.lightCount')
          s = s.replace('light.pos + worldPush.lightRebase.xyz', 'light.pos + push.lightRebase.xyz')
          s = s.replace('fogLocalLightInscatter(midpoint) * f.albedo', 'fogLocalLightInscatter(push, midpoint) * f.albedo')
          p.write_text(s)
          PY
          grep -n "fogLocalLightInscatter\|push.lightCount\|push.lightRebase" shaders/pipelines/world/fog.slang
      - name: Commit fix and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/codex-fix-fog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shaders/pipelines/world/fog.slang .github/workflows/codex-fix-fog.yml
          git commit -m 'Fix fog local-light WorldPush scope'
          git push origin HEAD:codex/claude-pass
