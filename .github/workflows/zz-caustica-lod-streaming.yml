name: CausticaLOD streaming starvation fix

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-streaming.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply LOD scheduling fix
        run: python3 .github/zz_patch_lod_streaming.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtDhLodSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodPackedSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java
          git commit -m "Prevent near terrain from starving or overlapping CausticaLOD"
          git push origin HEAD:codex/claude-pass
