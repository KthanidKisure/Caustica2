name: CausticaLOD bounded import

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-bounded-import.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Bound WynnLOD conversion memory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java')
          s = p.read_text()

          s = s.replace('import com.mojang.serialization.Dynamic;\n',
                        'import com.mojang.serialization.Dynamic;\nimport it.unimi.dsi.fastutil.longs.LongOpenHashSet;\n', 1)
          s = s.replace('import java.io.ByteArrayInputStream;\nimport java.io.IOException;\n',
                        'import java.io.ByteArrayInputStream;\nimport java.io.DataInputStream;\nimport java.io.DataOutputStream;\nimport java.io.EOFException;\nimport java.io.IOException;\n', 1)
          s = s.replace('import java.nio.file.StandardCopyOption;\n',
                        'import java.nio.file.StandardCopyOption;\nimport java.nio.file.StandardOpenOption;\n', 1)
          s = s.replace('import java.util.List;\nimport java.util.Locale;\n',
                        'import java.util.LinkedHashMap;\nimport java.util.List;\nimport java.util.Locale;\n', 1)

          old = ''' * <p>On Wynncraft, an existing {@code .voxy/saves/<server>} dataset is preferred. If none exists,\n * Caustica downloads the official WynnLOD Voxy archive, verifies its release SHA-256, converts it, then\n * deletes the extracted staging tree and archive. The conversion runs on a minimum-priority daemon\n * thread and publishes every region atomically, so it cannot stall the render thread or expose a\n * half-written region file.</p>'''
          new = ''' * <p>On Wynncraft, Caustica downloads the official WynnLOD Voxy archive, verifies its release SHA-256,\n * converts it, then deletes the extracted staging tree and archive. The converter is deliberately\n * bounded-memory: it indexes only horizontal section coordinates, point-reads one vertical column at a\n * time, and spills finished surface tiles into small per-region staging files. It never keeps the whole\n * Wynncraft surface in the Minecraft heap. The conversion runs on a minimum-priority daemon thread and\n * publishes every final region atomically.</p>'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('    private static ImportStats convertDatabase(')
          end = s.index('    private static BlockState[] decodeBlockMappings', start)
          replacement = r'''    private static ImportStats convertDatabase(RocksBridge bridge, Path database, Path sessionRoot) throws Exception {
        Path spoolRoot = sessionRoot.resolve(".wynnlod-spool");
        deleteTree(spoolRoot);
        deleteImportedRegions(sessionRoot);
        Files.createDirectories(spoolRoot);

        try (RocksBridge.Database db = bridge.open(database);
             RegionSpool spool = new RegionSpool(spoolRoot)) {
            BlockState[] states = decodeBlockMappings(bridge, db);

            // Voxy's RocksDB key order is excellent for level filtering but Y-major inside level 0. A
            // sequential value scan would therefore keep most horizontal columns alive at once. First
            // collect only their 64-bit X/Z identities (primitive set, no section payloads), then use
            // RocksDB's point-lookup path to process one complete vertical column at a time.
            LongOpenHashSet horizontalColumns = new LongOpenHashSet(131_072);
            int[] minSectionY = {Integer.MAX_VALUE};
            int[] maxSectionY = {Integer.MIN_VALUE};
            long[] candidateSections = {0L};
            bridge.forEachKey(db, "world_sections", keyBytes -> {
                if (keyBytes.length != Long.BYTES) {
                    return;
                }
                long key = ByteBuffer.wrap(keyBytes).order(ByteOrder.BIG_ENDIAN).getLong();
                if (voxyLevel(key) != 0) {
                    return;
                }
                int sx = voxyX(key);
                int sy = voxyY(key);
                int sz = voxyZ(key);
                horizontalColumns.add(packCoords(sx, sz));
                minSectionY[0] = Math.min(minSectionY[0], sy);
                maxSectionY[0] = Math.max(maxSectionY[0], sy);
                candidateSections[0]++;
            });
            if (horizontalColumns.isEmpty()) {
                throw new IOException("WynnLOD world_sections contains no level-0 Voxy sections");
            }

            long[] columns = horizontalColumns.toLongArray();
            java.util.Arrays.sort(columns);
            horizontalColumns.clear();
            CausticaMod.LOGGER.info(
                    "CausticaLOD WynnLOD index: {} level-0 section records, {} horizontal columns, section Y {}..{}",
                    candidateSections[0], columns.length, minSectionY[0], maxSectionY[0]);

            long successfulSections = 0L;
            long malformedSections = 0L;
            int usableTiles = 0;
            long startNanos = System.nanoTime();
            byte[] lookupKey = new byte[Long.BYTES];

            for (int columnIndex = 0; columnIndex < columns.length; columnIndex++) {
                long horizontal = columns[columnIndex];
                int sx = (int) (horizontal >> 32);
                int sz = (int) horizontal;
                int baseChunkX = sx * 2;
                int baseChunkZ = sz * 2;

                // Exactly four 16x16 chunks cover one 32x32 Voxy section footprint. Pre-seeding these
                // builders makes ingestSection allocation-free no matter how many vertical slabs exist.
                HashMap<Long, TileBuilder> tiles = new HashMap<>(8);
                for (int dx = 0; dx < 2; dx++) {
                    for (int dz = 0; dz < 2; dz++) {
                        int cx = baseChunkX + dx;
                        int cz = baseChunkZ + dz;
                        tiles.put(packCoords(cx, cz), new TileBuilder());
                    }
                }

                for (int sy = maxSectionY[0]; sy >= minSectionY[0]; sy--) {
                    long sectionKey = voxySectionKey(sx, sy, sz);
                    writeLongBigEndian(sectionKey, lookupKey);
                    byte[] compressed = bridge.get(db, "world_sections", lookupKey);
                    if (compressed == null) {
                        continue;
                    }
                    try {
                        byte[] raw = bridge.decompress(compressed);
                        ingestSection(sectionKey, raw, states, tiles);
                        successfulSections++;
                    } catch (Throwable t) {
                        malformedSections++;
                        if (malformedSections <= 8) {
                            CausticaMod.LOGGER.warn("Skipping malformed WynnLOD section 0x{}: {}",
                                    Long.toUnsignedString(sectionKey, 16), t.toString());
                        }
                    }
                    if (allGroundResolved(tiles)) {
                        break;
                    }
                }

                for (Map.Entry<Long, TileBuilder> entry : tiles.entrySet()) {
                    RtCausticaLodRegionStore.TileData tile = entry.getValue().finish();
                    if (tile == null) {
                        continue;
                    }
                    int chunkX = (int) (entry.getKey() >> 32);
                    int chunkZ = (int) (long) entry.getKey();
                    spool.append(chunkX, chunkZ, tile);
                    usableTiles++;
                }

                int done = columnIndex + 1;
                if ((done & 0x1ff) == 0 || done == columns.length) {
                    CausticaMod.LOGGER.info(
                            "CausticaLOD WynnLOD conversion: {}/{} horizontal columns, {} surface tiles",
                            done, columns.length, usableTiles);
                }
            }

            int regionCount = spool.publish(sessionRoot);
            double seconds = (System.nanoTime() - startNanos) / 1_000_000_000.0;
            if (malformedSections != 0L) {
                CausticaMod.LOGGER.warn("CausticaLOD WynnLOD conversion skipped {} malformed section(s)", malformedSections);
            }
            CausticaMod.LOGGER.info(
                    "CausticaLOD WynnLOD bounded conversion finished in {} s; peak tile working set is one Voxy column plus one packed region",
                    String.format(Locale.ROOT, "%.1f", seconds));
            return new ImportStats(successfulSections, usableTiles, regionCount);
        } finally {
            deleteTree(spoolRoot);
        }
    }

    private static boolean allGroundResolved(HashMap<Long, TileBuilder> tiles) {
        for (TileBuilder tile : tiles.values()) {
            if (!tile.complete()) {
                return false;
            }
        }
        return true;
    }

'''
          s = s[:start] + replacement + s[end:]

          anchor = '''    private static long packCoords(int x, int z) {\n        return ((long) x << 32) ^ (z & 0xffff_ffffL);\n    }\n'''
          extra = '''    private static long voxySectionKey(int x, int y, int z) {\n        return ((long) (y & 0xff) << 52)\n                | ((long) (z & 0x00ff_ffff) << 28)\n                | ((long) (x & 0x00ff_ffff) << 4);\n    }\n\n    private static void writeLongBigEndian(long value, byte[] out) {\n        for (int i = 0; i < Long.BYTES; i++) {\n            out[i] = (byte) (value >>> (56 - i * 8));\n        }\n    }\n\n    /** Remove only partial imported region packs. Live .clod captures are a separate namespace. */\n    private static void deleteImportedRegions(Path sessionRoot) throws IOException {\n        RtCausticaLodRegionStore.reset();\n        if (!Files.isDirectory(sessionRoot)) {\n            return;\n        }\n        try (var files = Files.list(sessionRoot)) {\n            files.filter(Files::isRegularFile).filter(path -> {\n                String name = path.getFileName().toString();\n                return name.startsWith("r.") && (name.endsWith(".clodr") || name.endsWith(".clodr.tmp"));\n            }).forEach(path -> {\n                try {\n                    Files.deleteIfExists(path);\n                } catch (IOException e) {\n                    throw new java.io.UncheckedIOException(e);\n                }\n            });\n        } catch (java.io.UncheckedIOException e) {\n            throw e.getCause();\n        }\n    }\n\n'''
          assert anchor in s
          s = s.replace(anchor, anchor + '\n' + extra, 1)

          old = '''    private static final class TileBuilder {\n        final short[] groundY = new short[RtCausticaLodRegionStore.TILE_COLUMNS];'''
          new = '''    private static final class TileBuilder {\n        final short[] groundY = new short[RtCausticaLodRegionStore.TILE_COLUMNS];'''
          assert old in s
          # fields are inserted separately to keep the exact original header intact
          field_anchor = '''        final int[] surfaceStateId = new int[RtCausticaLodRegionStore.TILE_COLUMNS];\n'''
          assert field_anchor in s
          s = s.replace(field_anchor, field_anchor + '        int resolvedGroundColumns;\n', 1)

          old = '''        void offerGround(int column, int y, int groundId, int bodyId) {\n            if (groundY[column] == RtCausticaLodRegionStore.NO_HEIGHT || y > groundY[column]) {\n                groundY[column] = clampHeight(y);\n                groundStateId[column] = groundId;\n                bodyStateId[column] = bodyId;\n            }\n        }\n\n        RtCausticaLodRegionStore.TileData finish() {'''
          new = '''        void offerGround(int column, int y, int groundId, int bodyId) {\n            if (groundY[column] == RtCausticaLodRegionStore.NO_HEIGHT || y > groundY[column]) {\n                if (groundY[column] == RtCausticaLodRegionStore.NO_HEIGHT) {\n                    resolvedGroundColumns++;\n                }\n                groundY[column] = clampHeight(y);\n                groundStateId[column] = groundId;\n                bodyStateId[column] = bodyId;\n            }\n        }\n\n        boolean complete() {\n            return resolvedGroundColumns == RtCausticaLodRegionStore.TILE_COLUMNS;\n        }\n\n        RtCausticaLodRegionStore.TileData finish() {'''
          assert old in s
          s = s.replace(old, new, 1)

          region_anchor = '''    /** Reflection boundary around optional conversion libraries, keeping them out of Caustica's runtime ABI. */\n    private static final class RocksBridge implements AutoCloseable {'''
          region_class = r'''    /**
     * Small disk-backed staging area. At most 32 append streams and one 32x32-chunk region payload are
     * resident at once, so conversion memory does not scale with Wynncraft's map area.
     */
    private static final class RegionSpool implements AutoCloseable {
        private static final int MAX_OPEN_STREAMS = 32;
        private final Path root;
        private final Set<Long> regionKeys = new HashSet<>();
        private final LinkedHashMap<Long, DataOutputStream> streams = new LinkedHashMap<>(32, 0.75f, true);

        RegionSpool(Path root) {
            this.root = root;
        }

        void append(int chunkX, int chunkZ, RtCausticaLodRegionStore.TileData tile) throws IOException {
            int rx = RtCausticaLodRegionStore.regionX(chunkX);
            int rz = RtCausticaLodRegionStore.regionZ(chunkZ);
            long regionKey = packCoords(rx, rz);
            regionKeys.add(regionKey);
            DataOutputStream out = stream(regionKey, rx, rz);
            out.writeInt(RtCausticaLodRegionStore.slot(chunkX, chunkZ));
            writeTile(out, tile);
        }

        int publish(Path sessionRoot) throws IOException {
            closeStreams();
            ArrayList<Long> keys = new ArrayList<>(regionKeys);
            keys.sort(Comparator.comparingLong(Long::longValue));
            int count = 0;
            for (long regionKey : keys) {
                int rx = (int) (regionKey >> 32);
                int rz = (int) regionKey;
                HashMap<Integer, RtCausticaLodRegionStore.TileData> tiles = new HashMap<>(1024);
                Path path = spoolPath(rx, rz);
                try (DataInputStream in = new DataInputStream(new BufferedInputStream(Files.newInputStream(path), 1 << 16))) {
                    while (true) {
                        final int slot;
                        try {
                            slot = in.readInt();
                        } catch (EOFException done) {
                            break;
                        }
                        if (slot < 0 || slot >= 1024) {
                            throw new IOException("Invalid CausticaLOD spool slot " + slot + " in " + path);
                        }
                        RtCausticaLodRegionStore.TileData previous = tiles.put(slot, readTile(in));
                        if (previous != null) {
                            throw new IOException("Duplicate CausticaLOD spool slot " + slot + " in " + path);
                        }
                    }
                }
                RtCausticaLodRegionStore.writeRegion(sessionRoot, rx, rz, tiles);
                Files.deleteIfExists(path);
                count++;
                if ((count & 31) == 0 || count == keys.size()) {
                    CausticaMod.LOGGER.info("CausticaLOD WynnLOD pack publish: {}/{} regions", count, keys.size());
                }
            }
            return count;
        }

        private DataOutputStream stream(long key, int rx, int rz) throws IOException {
            DataOutputStream current = streams.get(key);
            if (current != null) {
                return current;
            }
            if (streams.size() >= MAX_OPEN_STREAMS) {
                Map.Entry<Long, DataOutputStream> eldest = streams.entrySet().iterator().next();
                eldest.getValue().close();
                streams.remove(eldest.getKey());
            }
            DataOutputStream opened = new DataOutputStream(new BufferedOutputStream(
                    Files.newOutputStream(spoolPath(rx, rz), StandardOpenOption.CREATE, StandardOpenOption.APPEND), 1 << 16));
            streams.put(key, opened);
            return opened;
        }

        private Path spoolPath(int rx, int rz) {
            return root.resolve("r." + rx + "." + rz + ".spool");
        }

        private static void writeTile(DataOutputStream out, RtCausticaLodRegionStore.TileData tile) throws IOException {
            for (int i = 0; i < RtCausticaLodRegionStore.TILE_COLUMNS; i++) {
                out.writeShort(tile.groundY()[i]);
                out.writeShort(tile.surfaceY()[i]);
                out.writeInt(tile.groundStateId()[i]);
                out.writeInt(tile.bodyStateId()[i]);
                out.writeInt(tile.surfaceStateId()[i]);
            }
        }

        private static RtCausticaLodRegionStore.TileData readTile(DataInputStream in) throws IOException {
            short[] groundY = new short[RtCausticaLodRegionStore.TILE_COLUMNS];
            short[] surfaceY = new short[RtCausticaLodRegionStore.TILE_COLUMNS];
            int[] groundState = new int[RtCausticaLodRegionStore.TILE_COLUMNS];
            int[] bodyState = new int[RtCausticaLodRegionStore.TILE_COLUMNS];
            int[] surfaceState = new int[RtCausticaLodRegionStore.TILE_COLUMNS];
            for (int i = 0; i < RtCausticaLodRegionStore.TILE_COLUMNS; i++) {
                groundY[i] = in.readShort();
                surfaceY[i] = in.readShort();
                groundState[i] = in.readInt();
                bodyState[i] = in.readInt();
                surfaceState[i] = in.readInt();
            }
            return new RtCausticaLodRegionStore.TileData(groundY, surfaceY, groundState, bodyState, surfaceState);
        }

        private void closeStreams() throws IOException {
            IOException failure = null;
            for (DataOutputStream out : streams.values()) {
                try {
                    out.close();
                } catch (IOException e) {
                    if (failure == null) failure = e; else failure.addSuppressed(e);
                }
            }
            streams.clear();
            if (failure != null) {
                throw failure;
            }
        }

        @Override
        public void close() throws IOException {
            closeStreams();
        }
    }

'''
          assert region_anchor in s
          s = s.replace(region_anchor, region_class + region_anchor, 1)

          # Extend RocksBridge with key-only iteration and direct point reads.
          field = '''        private final Method iteratorValue;\n        private final Method iteratorNext;\n'''
          assert field in s
          s = s.replace(field, field + '        private final Method get;\n', 1)
          ctor = '''            this.iteratorValue = iteratorClass.getMethod("value");\n            this.iteratorNext = iteratorClass.getMethod("next");\n'''
          assert ctor in s
          s = s.replace(ctor, ctor + '            this.get = rocksClass.getMethod("get", cfHandleClass, byte[].class);\n', 1)

          method_anchor = '''        void forEach(Database db, String columnFamily, ByteConsumer consumer) throws Exception {'''
          key_methods = r'''        void forEachKey(Database db, String columnFamily, KeyConsumer consumer) throws Exception {
            Object handle = db.handlesByName.get(columnFamily);
            if (handle == null) {
                throw new IOException("Voxy database lacks column family " + columnFamily);
            }
            Object iterator = newIterator.invoke(db.db, handle);
            try {
                iteratorSeekToFirst.invoke(iterator);
                while ((boolean) iteratorIsValid.invoke(iterator)) {
                    consumer.accept((byte[]) iteratorKey.invoke(iterator));
                    iteratorNext.invoke(iterator);
                }
            } finally {
                ((AutoCloseable) iterator).close();
            }
        }

        byte[] get(Database db, String columnFamily, byte[] key) throws Exception {
            Object handle = db.handlesByName.get(columnFamily);
            if (handle == null) {
                throw new IOException("Voxy database lacks column family " + columnFamily);
            }
            return (byte[]) get.invoke(db.db, handle, key);
        }

'''
          assert method_anchor in s
          s = s.replace(method_anchor, key_methods + method_anchor, 1)

          interface_anchor = '''    @FunctionalInterface\n    private interface ByteConsumer {\n        void accept(byte[] key, byte[] value) throws Exception;\n    }\n}'''
          interfaces = '''    @FunctionalInterface\n    private interface KeyConsumer {\n        void accept(byte[] key) throws Exception;\n    }\n\n    @FunctionalInterface\n    private interface ByteConsumer {\n        void accept(byte[] key, byte[] value) throws Exception;\n    }\n}'''
          assert interface_anchor in s
          s = s.replace(interface_anchor, interfaces, 1)

          p.write_text(s)
          PY

          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java
          git commit -m "Bound WynnLOD conversion memory"
          git push origin HEAD:codex/claude-pass
