name: Run bounded CausticaLOD patch

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-run-bounded-import.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Execute embedded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/zz-caustica-lod-bounded-import.yml')
          text = path.read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.rindex("\n          PY")
          raw = text[start:end]
          # Reproduce YAML block-scalar dedenting for the script lines while preserving the
          # intentionally unindented Java text inside Python raw triple-quoted strings.
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(script, str(path), 'exec'))
          PY
