name: NGX fingerprint reset fix

on:
  push:
    branches: [codex/post-merge-optimizations]
    paths: [".github/workflows/zz-ngx-fingerprint-reset.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-optimizations
          fetch-depth: 0
      - name: Apply NGX fingerprint reset fix
        run: python3 .github/zz_patch_ngx_fingerprint_reset.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/ngx/NgxRuntime.java
          git commit -m "Reset NGX fingerprints across runtime lifetimes"
          git push origin HEAD:codex/post-merge-optimizations
