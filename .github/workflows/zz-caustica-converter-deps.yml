name: CausticaLOD converter dependencies

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-converter-deps.yml"]

permissions:
  contents: write

jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Verify platform JARs and upgrade converter
        shell: bash
        run: |
          set -euo pipefail
          version=10.10.1.1
          base="https://repo.maven.apache.org/maven2/org/rocksdb/rocksdbjni/${version}"
          for classifier in win64 linux64; do
            name="rocksdbjni-${version}-${classifier}.jar"
            curl --fail --location --retry 3 -o "/tmp/${name}" "${base}/${name}"
            curl --fail --location --retry 3 -o "/tmp/${name}.sha256" "${base}/${name}.sha256"
            expected="$(tr -d '[:space:]' < "/tmp/${name}.sha256")"
            actual="$(sha256sum "/tmp/${name}" | awk '{print $1}')"
            test "${actual}" = "${expected}"
            jar tf "/tmp/${name}" | grep -q '^org/rocksdb/RocksDB.class$'
          done
          javap -classpath "/tmp/rocksdbjni-${version}-linux64.jar" org.rocksdb.RocksDB > /tmp/rocksdb-api.txt
          grep -F 'byte[] get(org.rocksdb.ColumnFamilyHandle, byte[])' /tmp/rocksdb-api.txt
          grep -F 'openReadOnly' /tmp/rocksdb-api.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java')
          s = p.read_text()
          assert 'private static final String ROCKS_VERSION = "10.2.1";' in s
          s = s.replace('private static final String ROCKS_VERSION = "10.2.1";',
                        'private static final String ROCKS_VERSION = "10.10.1.1";', 1)
          old = '    /** Maven Central publishes SHA-1 sidecars; verify them before loading a downloaded converter JAR. */\n    private static Path ensureMavenJar(String url, Path target) throws Exception {\n        String expected = downloadText(URI.create(url + ".sha1")).trim().split("\\\\s+")[0].toLowerCase(Locale.ROOT);\n        ensureDownload(URI.create(url), target, "SHA-1", expected);\n        return target;\n    }\n'
          new = '    /** Verify Maven Central SHA-256 sidecars before loading a downloaded converter JAR. */\n    private static Path ensureMavenJar(String url, Path target) throws Exception {\n        String expected = downloadText(URI.create(url + ".sha256")).trim().split("\\\\s+")[0].toLowerCase(Locale.ROOT);\n        ensureDownload(URI.create(url), target, "SHA-256", expected);\n        return target;\n    }\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java
          git commit -m "Upgrade and SHA-256 verify RocksDB converter"
          git push origin HEAD:codex/claude-pass
