name: Post-merge temporal and LOD optimization

on:
  push:
    branches: [codex/postmerge-streamline-lod]
    paths: [".github/workflows/zz-postmerge-temporal-lod.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/postmerge-streamline-lod
          fetch-depth: 0
      - name: Apply post-merge renderer patch
        run: python3 .github/zz_patch_postmerge_temporal_lod.py
      - name: Verify generated source has no whitespace errors
        run: git diff --check
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/pipeline/RtDlssRr.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodPackedSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtDhLodSource.java
          git add src/main/java/dev/comfyfluffy/caustica/client/CausticaClient.java
          git commit -m "Reset temporal history and dedupe LOD IO"
          git push origin HEAD:codex/postmerge-streamline-lod
