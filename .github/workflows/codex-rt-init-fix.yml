name: Apply RT pipeline initialization fix

on:
  push:
    branches:
      - codex/rt-pipeline-ordering-fix
    paths:
      - .github/workflows/codex-rt-init-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rt-pipeline-ordering-fix
          fetch-depth: 0

      - name: Apply focused RtComposite fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java")
          source = path.read_text(encoding="utf-8")

          premature = '''        // Created alongside the other RT resources because this is where ctx is in scope; the method
          // itself is idempotent, so a resize re-binds the existing texture rather than regenerating it.
          ensureCloudNoise(ctx);
'''
          if source.count(premature) != 1:
              raise SystemExit(f"expected exactly one premature cloud-noise call, found {source.count(premature)}")
          source = source.replace(premature, "", 1)

          pipeline_create = '''                    WorldPushConstantsData.BYTE_SIZE, bindlessTextureCapacity);
          // Per-frame world data lives in this BDA ring; the pipeline pushes its address and hot fields.
'''
          pipeline_replacement = '''                    WorldPushConstantsData.BYTE_SIZE, bindlessTextureCapacity);
          // Cloud noise is a descriptor owned by the world pipeline. Create/bind it only after the pipeline
          // exists; recreating the pipeline simply rebinds the device-lifetime texture and sampler.
          ensureCloudNoise(ctx);
          // Per-frame world data lives in this BDA ring; the pipeline pushes its address and hot fields.
'''
          if source.count(pipeline_create) != 1:
              raise SystemExit(f"expected exactly one world-pipeline creation seam, found {source.count(pipeline_create)}")
          source = source.replace(pipeline_create, pipeline_replacement, 1)

          destroy_pipeline = '''        if (worldPipeline != null) {
              worldPipeline.destroy();
              worldPipeline = null;
          }
          bindlessTextureCapacity = 0;
'''
          destroy_replacement = '''        if (worldPipeline != null) {
              worldPipeline.destroy();
              worldPipeline = null;
          }
          if (cloudNoise != null) {
              cloudNoise.destroy();
              cloudNoise = null;
          }
          if (cloudNoiseSampler != 0L) {
              RtContext ctx = RtContext.currentOrNull();
              if (ctx != null) {
                  VK10.vkDestroySampler(ctx.vk(), cloudNoiseSampler, null);
              }
              cloudNoiseSampler = 0L;
          }
          bindlessTextureCapacity = 0;
'''
          if source.count(destroy_pipeline) != 1:
              raise SystemExit(f"expected exactly one world-pipeline teardown seam, found {source.count(destroy_pipeline)}")
          source = source.replace(destroy_pipeline, destroy_replacement, 1)

          if source.count("ensureCloudNoise(ctx);") != 1:
              raise SystemExit("cloud noise must be initialized from exactly one world-pipeline-owned seam")

          path.write_text(source, encoding="utf-8")

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-rt-init-fix.yml
          git add src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java
          git diff --cached --check
          git commit -m "Fix cloud noise pipeline initialization"
          git push origin HEAD:codex/rt-pipeline-ordering-fix
