name: CausticaLOD sampling and cache patch

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-sampling.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply robust LOD sampling and negative caches
        run: python3 .github/zz_patch_lod_sampling.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodPackedSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodSource.java
          git commit -m "Stabilize coarse CausticaLOD sampling and cache misses"
          git push origin HEAD:codex/claude-pass
