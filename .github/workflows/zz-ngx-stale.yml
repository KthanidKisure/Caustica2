name: Stale NGX runtime cleanup

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-ngx-stale.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply stale runtime cleanup
        run: python3 .github/zz_patch_ngx_stale.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/ngx/NgxRuntime.java
          git commit -m "Remove stale extracted NGX feature runtimes"
          git push origin HEAD:codex/claude-pass
