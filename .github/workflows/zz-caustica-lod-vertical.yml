name: CausticaLOD vertical coverage

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-vertical.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Update native LOD config and vertical paging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main/java/dev/comfyfluffy/caustica/CausticaConfig.java')
          s = p.read_text()
          old = '''        /**\n         * Distant terrain from Distant Horizons' database. Off by default.\n         *\n         * <p>DH is used as a WORLD DATABASE only — its own rendering should be disabled. Caustica reads\n         * LOD terrain through DH's public API, meshes it, and puts it in the acceleration structure, so\n         * distant terrain is traced like everything else: it casts shadows, appears in reflections and\n         * contributes to global illumination, which a rasterised LOD renderer cannot do.\n         *\n         * <p>Requires Distant Horizons installed with data for the current world. On a server that means\n         * something has populated its database — on Wynncraft, the WynnLODGrabber download.\n         */\n        public static final class Lod {\n            /** Master switch. Off skips every DH query, mesh and BLAS build. */\n            public static final BooleanSetting ENABLED =\n                    bool("caustica.rt.lod.enabled", "lod.enabled", false);\n            /**\n             * DH detail level. Each virtual block covers 2^detail world blocks, and one LOD section\n             * therefore spans 16*2^detail blocks for the triangle cost of one ordinary section:\n             * 3 gives 128-block sections, 4 gives 256. Lower is sharper and far more expensive.\n             */'''
          new = '''        /**\n         * Caustica-native path-traced distant terrain. No external LOD mod is required. Live worlds\n         * teach the persistent surface cache as chunks arrive; Wynncraft can additionally seed the\n         * cache from the verified official WynnLOD dataset in a one-time background conversion.\n         *\n         * <p>The representation stores the visible surface shell rather than complete chunks, then\n         * follows the ordinary Caustica material -> BLAS -> TLAS path, so distant terrain participates\n         * in ray-traced shadows, reflections and global illumination without raster LOD composition.\n         */\n        public static final class Lod {\n            /** Master switch for native surface capture, imported packs, meshing and LOD BLAS residency. */\n            public static final BooleanSetting ENABLED =\n                    bool("caustica.rt.lod.enabled", "lod.enabled", true);\n            /**\n             * Surface detail level. Each virtual cell covers 2^detail world blocks and one LOD section\n             * spans 16*2^detail blocks: 3 gives 128-block sections, 4 gives 256. Lower is sharper and\n             * more expensive; higher is cheaper and intended for very distant terrain.\n             */'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            /**\n             * Vertical span in LOD sections, centred on sea level. Distant terrain rarely needs the\n             * full world height, and every extra layer is a full ring of sections.\n             */\n            public static final IntSetting HEIGHT_SECTIONS =\n                    clampedInt("caustica.rt.lod.heightSections", "lod.height-sections", 2, 1, 16);\n            /**\n             * LOD sections started per frame. This is the streaming throttle: each one is a DH database\n             * query plus a mesh plus a BLAS build, so a high value stutters while the world loads.\n             */'''
          new = '''            /**\n             * Maximum vertical LOD pages. The streamer derives the pages from the world's actual\n             * build-height range; the default covers the complete range at every supported detail.\n             * Lowering this centres the retained pages around the player as a performance trade-off.\n             */\n            public static final IntSetting HEIGHT_SECTIONS =\n                    clampedInt("caustica.rt.lod.heightSections", "lod.height-sections", 16, 1, 16);\n            /**\n             * LOD sections started per frame. This is the streaming throttle: each one samples the\n             * native surface source, meshes it and prepares a BLAS, so a high value can cause load spikes.\n             */'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java')
          s = p.read_text()
          replacements = [
              ('/** Failed DH API/lifecycle queries: retry soon; never poison the long empty-region cache. */',
               '/** Transient source misses: retry soon and never poison the long empty-region cooldown. */'),
              ('/** Render-frame deadline before an empty/failed DH region may be queried again. Render-thread only. */',
               '/** Render-frame deadline before an empty/failed native LOD region may be queried again. Render-thread only. */'),
              ('/** Regions DH had no geometry for. If this climbs while published stays 0, the database is the problem. */',
               '/** Native LOD regions with no geometry. If this climbs while published stays 0, inspect source coverage. */'),
              ('/** Total boxes DH handed back. Non-zero with zero published means meshing is the problem, not DH. */',
               '/** Total surface boxes handed to the virtual mesher. Non-zero with zero published isolates meshing/BLAS. */'),
              ('// ---- Distant LOD from Distant Horizons -------------------------------------------------------',
               '// ---- Caustica-native distant LOD --------------------------------------------------------------'),
              ('// The single most useful line: says plainly whether DH\'s API resolved at all, which\n                // separates "Caustica is not asking" from "DH has no data".',
               '// The single most useful line separates disabled/unavailable native source state from\n                // later meshing or BLAS publication failures.'),
              ('CausticaMod.LOGGER.info("LOD enabled but the Distant Horizons API is unavailable; no distant terrain");',
               'CausticaMod.LOGGER.info("CausticaLOD enabled but its native source is not ready; no distant terrain yet");'),
              ('"LOD: {} regions queried, {} boxes returned by DH, none published (detail {})",',
               '"CausticaLOD: {} empty regions, {} source boxes observed, none published (detail {})",'),
              ('CausticaMod.LOGGER.info("LOD active: detail={}, radius={}, DH source available",',
               'CausticaMod.LOGGER.info("CausticaLOD active: detail={}, radius={}, native source available",'),
              ('// One query covering the section\'s whole footprint. DH\'s detailLevel is the size of\n                    // the queried AREA, not the data resolution, so the footprint is what it needs —\n                    // asking for "detail 3" got an 8x8-block area per 128-block section, which is why\n                    // sections came back empty.',
               '// One source query covers this virtual section\'s whole horizontal footprint. The source\n                    // returns world-space surface boxes; RtDhLodRegion clips/resamples them into this\n                    // page before the ordinary material mesher builds its path-traced geometry.'),
              ('// Empty means DH returned no solid blocks here — either the region is not in\n                        // its database, or the detail level has not been generated. Counted rather\n                        // than logged per section, which would be thousands of lines.',
               '// Empty means the native surface cache has no geometry for this page/footprint yet.\n                        // Count rather than logging every region, which would produce thousands of lines.'),
              ('// A rejected DH call is a source lifecycle problem, not an empty terrain result.',
               '// A transient source miss is not a confirmed empty terrain result.'),
              ('"LOD: DH source not query-ready; retrying in 1 second ({} regions deferred)",',
               '"CausticaLOD source not query-ready; retrying in 1 second ({} regions deferred)",'),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)

          old = '''        int heightSections = CausticaConfig.Rt.Lod.HEIGHT_SECTIONS.value();\n        int budget = CausticaConfig.Rt.Lod.SECTIONS_PER_FRAME.value();\n\n        int centreX = Math.floorDiv(pbx, sectionBlocks);\n        int centreZ = Math.floorDiv(pbz, sectionBlocks);\n        int centreY = Math.floorDiv(62, sectionBlocks);\n        evictLodOutside(ctx, centreX, centreZ, sectionBlocks, radius + 2);'''
          new = '''        int configuredHeightSections = CausticaConfig.Rt.Lod.HEIGHT_SECTIONS.value();\n        int budget = CausticaConfig.Rt.Lod.SECTIONS_PER_FRAME.value();\n\n        int centreX = Math.floorDiv(pbx, sectionBlocks);\n        int centreZ = Math.floorDiv(pbz, sectionBlocks);\n        int minPageY = Math.floorDiv(level.getMinY(), sectionBlocks);\n        int maxBlockY = level.getMinY() + level.getHeight() - 1;\n        int maxPageY = Math.floorDiv(maxBlockY, sectionBlocks);\n        int worldPageCount = Math.max(1, maxPageY - minPageY + 1);\n        int heightSections = Math.min(configuredHeightSections, worldPageCount);\n        int playerPageY = Math.floorDiv(pby, sectionBlocks);\n        int maxStartY = maxPageY - heightSections + 1;\n        int startPageY = Math.clamp(playerPageY - heightSections / 2, minPageY, maxStartY);\n        evictLodOutside(ctx, centreX, centreZ, sectionBlocks, radius + 2);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '                        int ly = centreY + dy;'
          new = '                        int ly = startPageY + dy;'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/CausticaConfig.java src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java
          git commit -m "Cover full world height with native CausticaLOD"
          git push origin HEAD:codex/claude-pass
