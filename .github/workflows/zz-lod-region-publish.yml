name: CausticaLOD dense region publication

on:
  push:
    branches: [codex/post-merge-optimizations]
    paths: [".github/workflows/zz-lod-region-publish.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-optimizations
          fetch-depth: 0
      - name: Apply dense region publication
        run: python3 .github/zz_patch_lod_region_publish.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodRegionStore.java
          git commit -m "Use dense packed-region publication"
          git push origin HEAD:codex/post-merge-optimizations
