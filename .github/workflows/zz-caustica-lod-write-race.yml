name: CausticaLOD write race fixup

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-write-race.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Fix literal newline escape in Java source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodSource.java')
          s = p.read_text()
          old = '    // Key by final path, not chunk coordinates: writes queued for an old server/dimension must never\\n    // collide with or publish into the current session after a proxy/world transition.\\n    private static final ConcurrentHashMap<Path, Boolean> WRITE_PENDING = new ConcurrentHashMap<>();'
          new = '''    // Key by final path, not chunk coordinates: writes queued for an old server/dimension must never
    // collide with or publish into the current session after a proxy/world transition.
    private static final ConcurrentHashMap<Path, Boolean> WRITE_PENDING = new ConcurrentHashMap<>();'''
          assert old in s, 'expected literal-newline write-race comment not found'
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodSource.java
          git commit -m "Fix native LOD write-race declaration"
          git push origin HEAD:codex/claude-pass
