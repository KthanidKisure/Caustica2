name: Apply comprehensive renderer pass

on:
  push:
    branches:
      - codex/claude-pass
    paths:
      - .github/workflows/codex-claude-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0

      - name: Apply renderer changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def one(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return source.replace(old, new, 1)

          # ---- Renderer defaults / view-transform policy -----------------------------------------
          path = "src/main/java/dev/comfyfluffy/caustica/CausticaConfig.java"
          s = text(path)
          s = one(s,
              'public static final IntSetting PRESET = intValue("caustica.rt.dlssRr.preset", "dlss-rr.preset", 0);',
              'public static final IntSetting PRESET = intValue("caustica.rt.dlssRr.preset", "dlss-rr.preset", 6);',
              "DLSS preset F")
          s = one(s,
              'intChoice("caustica.rt.dlssRr.quality", "dlss-rr.quality", 0, QUALITY_STEPS);',
              'intChoice("caustica.rt.dlssRr.quality", "dlss-rr.quality", 2, QUALITY_STEPS);',
              "DLSS quality")
          s = one(s,
              'clampedFloat("caustica.rt.fog.density", "fog.density", 0.0f, 0.0f, 1.0f);',
              'clampedFloat("caustica.rt.fog.density", "fog.density", 0.0025f, 0.0f, 1.0f);',
              "fog default")
          s = one(s,
              'clampedFloat("caustica.rt.clouds.coverage", "clouds.coverage", 0.0f, 0.0f, 1.0f);',
              'clampedFloat("caustica.rt.clouds.coverage", "clouds.coverage", 0.45f, 0.0f, 1.0f);',
              "cloud default")
          s = one(s,
              'clampedFloat("caustica.rt.pom.depth", "pom.depth", 0.0f, 0.0f, 0.5f);',
              'clampedFloat("caustica.rt.pom.depth", "pom.depth", 0.05f, 0.0f, 0.5f);',
              "POM default")
          s = one(s,
              'clampedFloat("caustica.rt.restir.temporal", "restir.temporal", 0.0f, 0.0f, 1.0f);',
              'clampedFloat("caustica.rt.restir.temporal", "restir.temporal", 0.90f, 0.0f, 1.0f);',
              "ReSTIR temporal")
          s = one(s,
              'intAtLeast("caustica.rt.restir.spatialTaps", "restir.spatial-taps", 3, 0);',
              'intAtLeast("caustica.rt.restir.spatialTaps", "restir.spatial-taps", 2, 0);',
              "ReSTIR taps")
          s = one(s,
              'clampedFloat("caustica.rt.restir.spatialRadius", "restir.spatial-radius",\n                            8.0f, 1.0f, 64.0f);',
              'clampedFloat("caustica.rt.restir.spatialRadius", "restir.spatial-radius",\n                            6.0f, 1.0f, 64.0f);',
              "ReSTIR radius")
          s = one(s,
              'clampedFloat("caustica.rt.grade.sharpness", "grade.sharpness", 0.0f, 0.0f, 1.0f);',
              'clampedFloat("caustica.rt.grade.sharpness", "grade.sharpness", 0.12f, 0.0f, 1.0f);',
              "RCAS default")
          s = one(s,
              'string("caustica.rt.tonemap.viewTransform", "tonemap.view-transform",\n                            "aces2", Tonemap::sanitizeViewTransform);',
              'string("caustica.rt.tonemap.viewTransform", "tonemap.view-transform",\n                            "agx-punchy-hdr", Tonemap::sanitizeViewTransform);',
              "Punchy HDR default")
          s = one(s,
              '''            private static String sanitizeViewTransform(String value) {\n                if ("agx-punchy".equalsIgnoreCase(value)) {\n                    return "agx-punchy";\n                }''',
              '''            private static String sanitizeViewTransform(String value) {\n                if ("agx-punchy-hdr".equalsIgnoreCase(value)) {\n                    return "agx-punchy-hdr";\n                }\n                if ("agx-punchy".equalsIgnoreCase(value)) {\n                    return "agx-punchy";\n                }''',
              "view transform sanitizer")
          s = one(s,
              '''            public static String hdrLutResource(int peakNits) {\n                if ("agx-punchy".equals(VIEW_TRANSFORM.get())) {\n                    return "hdr_agx_punchy_rec2020.bin";\n                }\n                return "hdr_aces2_rec2020_" + peakNits + "nit.bin";\n            }\n\n            /** Resource name under {@code /caustica/color/luts/} for the selected SDR view transform. */''',
              '''            public static String hdrLutResource(int peakNits) {\n                if ("agx-punchy".equals(VIEW_TRANSFORM.get())) {\n                    return "hdr_agx_punchy_rec2020.bin";\n                }\n                return "hdr_aces2_rec2020_" + peakNits + "nit.bin";\n            }\n\n            /**\n             * Scene-referred Punchy appearance followed by the ordinary ACES 2.0 display transform.\n             * Unlike the legacy AgX HDR construction, this keeps the selected HDR mastering range.\n             */\n            public static boolean punchyHdrLook() {\n                return "agx-punchy-hdr".equals(VIEW_TRANSFORM.get());\n            }\n\n            /** Resource name under {@code /caustica/color/luts/} for the selected SDR view transform. */''',
              "Punchy HDR helper")
          s = one(s,
              '''                switch (VIEW_TRANSFORM.get()) {\n                    case "agx-punchy":\n                        return "sdr_agx_punchy_rec709.bin";''',
              '''                switch (VIEW_TRANSFORM.get()) {\n                    case "agx-punchy-hdr":\n                        return "sdr_aces2_rec709.bin";\n                    case "agx-punchy":\n                        return "sdr_agx_punchy_rec709.bin";''',
              "Punchy HDR SDR transform")
          s = s.replace("Exponential height fog. Off by default:", "Exponential height fog. A subtle aerial-perspective baseline is enabled by default:")
          s = s.replace("Volumetric cloud deck. Off by default:", "Volumetric cloud system. A moderate natural-sky coverage is enabled by default:")
          s = s.replace("ReSTIR temporal reuse for the block-emitter reservoirs. Off by default.", "ReSTIR temporal reuse for the block-emitter reservoirs. Enabled by default with conservative history weighting.")
          s = s.replace("SDR view transform: {@code aces2} (default), {@code agx-punchy}, or {@code agx-base}.",
                        "View transform: {@code agx-punchy-hdr} (default), {@code aces2}, {@code agx-punchy}, or {@code agx-base}.")
          write(path, s)

          # ---- Display push ABI + full-range Punchy HDR look -------------------------------------
          path = "shaders/common/display_common.slang"
          s = text(path)
          s = one(s,
              '    public int lookEnabled;     // 0 = identity, 1 = apply the scene-referred ACES look LUT\n    public float lookLutSize;',
              '    public int lookEnabled;     // 0 = identity, 1 = apply the scene-referred ACES look LUT\n    public int punchyHdrLook;   // scene-referred Punchy appearance; ACES 2.0 still owns the output transform\n    public float lookLutSize;',
              "display push Punchy field")
          write(path, s)

          path = "src/main/java/dev/comfyfluffy/caustica/rt/pipeline/RtDisplayPipeline.java"
          s = text(path)
          s = one(s,
              '''public void dispatch(VkCommandBuffer cmd, int width, int height, boolean hdrEnabled, int lutSize,\n                         float gamma, float hdrPeakNits, boolean lookEnabled, int lookLutSize,''',
              '''public void dispatch(VkCommandBuffer cmd, int width, int height, boolean hdrEnabled, int lutSize,\n                         float gamma, float hdrPeakNits, boolean lookEnabled, boolean punchyHdrLook, int lookLutSize,''',
              "display dispatch signature")
          s = one(s,
              '''new DisplayPushData(hdrEnabled ? 1 : 0, (float) lutSize, gamma, hdrPeakNits,\n                    lookEnabled ? 1 : 0, (float) lookLutSize, bloomStrength,''',
              '''new DisplayPushData(hdrEnabled ? 1 : 0, (float) lutSize, gamma, hdrPeakNits,\n                    lookEnabled ? 1 : 0, punchyHdrLook ? 1 : 0, (float) lookLutSize, bloomStrength,''',
              "display push writer")
          write(path, s)

          path = "shaders/pipelines/display/main.comp.slang"
          s = text(path)
          marker = '''float3 sampleBloom(int2 outputPixel, uint outputWidth, uint outputHeight) {'''
          punchy = '''// Punchy is a scene-referred appearance, not an output transform. It raises local contrast and\n// chroma around photographic midtones while smoothly relaxing toward unity in bright highlights. The\n// ACES 2.0 SDR/HDR ODT still receives unbounded scene-linear values, so HDR highlight headroom remains\n// available instead of being rolled into AgX's approximately-100-nit sigmoid white point.\nfloat3 applyPunchyHdrLook(float3 acesCg) {\n    if (pc.punchyHdrLook == 0) {\n        return acesCg;\n    }\n    float3 color = max(acesCg, float3(0.0));\n    float luma = max(dot(color, ACESCG_LUMA), 1.0e-6);\n    float ev = log2(luma / GRADE_PIVOT);\n    float contrast = lerp(1.10, 1.035, smoothstep(2.0, 7.0, ev));\n    float mappedLuma = GRADE_PIVOT * exp2(ev * contrast);\n    float3 contrasted = color * (mappedLuma / luma);\n    float saturation = lerp(1.13, 1.01, smoothstep(0.8, 8.0, mappedLuma));\n    return max(lerp(float3(mappedLuma), contrasted, saturation), float3(0.0));\n}\n\n'''
          if marker not in s:
              raise SystemExit("display shader insertion point missing")
          s = s.replace(marker, punchy + marker, 1)
          s = one(s,
              '    return applyGrade(applyLook(exposedAcesCg));',
              '    return applyGrade(applyPunchyHdrLook(applyLook(exposedAcesCg)));',
              "Punchy look application")
          write(path, s)

          # ---- Weather classification / cloud layers / fog payload -------------------------------
          path = "src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java"
          s = text(path)
          s = one(s,
              '''            float biomeHaze = 1f;\n            float wetness = 0f;''',
              '''            float biomeHaze = 1f;\n            float wetness = 0f;\n            float biomeTemperature = 0.8f;\n            boolean biomeHasPrecipitation = true;''',
              "biome weather state")
          s = one(s,
              '''                float temperature = Mth.clamp(biome.getBaseTemperature(), 0f, 2f);\n                float climate = (1f - temperature * 0.5f) * (biome.hasPrecipitation() ? 1f : 0.35f);''',
              '''                biomeTemperature = Mth.clamp(biome.getBaseTemperature(), 0f, 2f);\n                biomeHasPrecipitation = biome.hasPrecipitation();\n                float climate = (1f - biomeTemperature * 0.5f) * (biomeHasPrecipitation ? 1f : 0.35f);''',
              "biome temperature")
          s = one(s,
              '''                boolean rainsHere = biome.hasPrecipitation() && biome.getBaseTemperature() > 0.15f;\n                wetness = rainsHere ? rainLevel * CausticaConfig.Rt.Clouds.WETNESS.value() : 0f;\n            }\n            // Rain multiplies fog density rather than adding to it, so a configured density of 0 stays\n            // 0 in a downpour. Weather driving a feature the user switched off would be a surprise.\n            float fogWeather = 1f + rainLevel * CausticaConfig.Rt.Fog.WEATHER_RESPONSE.value();''',
              '''                boolean rainsHere = biomeHasPrecipitation && biomeTemperature > 0.15f;\n                wetness = rainsHere ? rainLevel * CausticaConfig.Rt.Clouds.WETNESS.value() : 0f;\n            }\n            float weatherIntensity = Math.min(rainLevel + thunderLevel * 0.5f, 1f);\n            // 0 = rain/ordinary atmosphere, 1 = snowstorm, 2 = dry hot-biome dust/sandstorm. The\n            // classification is camera-biome based so crossing into a snowy or desert biome changes\n            // precipitation without a per-pixel biome lookup in the path tracer.\n            int weatherType = 0;\n            if (weatherIntensity > 0.01f) {\n                if (biomeHasPrecipitation && biomeTemperature <= 0.15f) {\n                    weatherType = 1;\n                } else if (!biomeHasPrecipitation && biomeTemperature >= 1.2f) {\n                    weatherType = 2;\n                }\n            }\n            float fogWeather = 1f + rainLevel * CausticaConfig.Rt.Fog.WEATHER_RESPONSE.value();''',
              "weather classification")
          s = one(s,
              '''            Float4 fog = new Float4(\n                    CausticaConfig.Rt.Fog.DENSITY.value() * fogWeather * biomeHaze,\n                    1.0f / fogScaleHeight,''',
              '''            float precipitationFog = weatherType == 1 ? weatherIntensity * 0.010f\n                    : weatherType == 2 ? weatherIntensity * 0.020f : 0f;\n            Float4 fog = new Float4(\n                    CausticaConfig.Rt.Fog.DENSITY.value() * fogWeather * biomeHaze + precipitationFog,\n                    1.0f / fogScaleHeight,''',
              "weather fog density")
          s = one(s,
              '''            float cloudWeather = CausticaConfig.Rt.Clouds.WEATHER_RESPONSE.value()\n                    * Math.min(rainLevel + thunderLevel * 0.5f, 1f);''',
              '''            float cloudWeather = CausticaConfig.Rt.Clouds.WEATHER_RESPONSE.value() * weatherIntensity;\n            // Dry-biome storms are carried mainly by the dust volume; retaining a little cloud response\n            // keeps the sky coherent without turning a desert storm into a tropical overcast.\n            if (weatherType == 2) {\n                cloudWeather *= 0.30f;\n            }''',
              "cloud weather response")
          s = one(s,
              '''            Float4 dimCloud = new Float4(cloudR, cloudG, cloudB,\n                    CausticaConfig.Rt.Clouds.VANILLA_TINT.value());\n            Float4 cloud3 = new Float4(CausticaConfig.Rt.Clouds.QUALITY.value(), 0f, 0f, 0f);\n            Float4 fog2 = new Float4(CausticaConfig.Rt.Fog.DEBUG.value(), 0f, 0f, 0f);''',
              '''            Float4 dimCloud = new Float4(cloudR, cloudG, cloudB,\n                    CausticaConfig.Rt.Clouds.VANILLA_TINT.value());\n            Float4 fog2 = new Float4(CausticaConfig.Rt.Fog.DEBUG.value(), weatherType, weatherIntensity, 0f);''',
              "weather push setup")
          s = one(s,
              '''            float cloudCoverage = CausticaConfig.Rt.Clouds.COVERAGE.value();\n            cloudCoverage += (1f - cloudCoverage) * cloudWeather * 0.85f;\n            Float4 cloud0 = new Float4(''',
              '''            float cloudCoverage = CausticaConfig.Rt.Clouds.COVERAGE.value();\n            cloudCoverage += (1f - cloudCoverage) * cloudWeather * 0.85f;\n            float secondaryCoverage = Math.clamp(cloudCoverage * 0.36f\n                    + (weatherType == 1 ? weatherIntensity * 0.18f : 0f), 0f, 0.68f);\n            if (weatherType == 2) {\n                secondaryCoverage *= 0.20f;\n            }\n            Float4 cloud3 = new Float4(CausticaConfig.Rt.Clouds.QUALITY.value(),\n                    weatherType, weatherIntensity, secondaryCoverage);\n            Float4 cloud0 = new Float4(''',
              "secondary cloud coverage")
          s = one(s,
              '''displayPipeline.dispatch(cmd, displayW, displayH, CausticaConfig.Rt.Hdr.enabled(),\n                        sdrToneLut.size, CausticaConfig.Rt.Tonemap.GAMMA.value(), loadedHdrLutNits,\n                        true, lookLut.size, LOOK.bloom().strength() / bloomLevels.length,''',
              '''displayPipeline.dispatch(cmd, displayW, displayH, CausticaConfig.Rt.Hdr.enabled(),\n                        sdrToneLut.size, CausticaConfig.Rt.Tonemap.GAMMA.value(), loadedHdrLutNits,\n                        true, CausticaConfig.Rt.Tonemap.punchyHdrLook(), lookLut.size,\n                        LOOK.bloom().strength() / bloomLevels.length,''',
              "display Punchy flag")
          write(path, s)

          # ---- World push reserved-lane documentation ---------------------------------------------
          path = "shaders/pipelines/world/world_common.slang"
          s = text(path)
          s = one(s,
              '// cloud3: x cloud march quality scale (1 = reference step counts), yzw unused.\n    public float4   cloud3;\n    // fog2: x = debug mode (1 = show raw fog in-scatter as the final colour), yzw unused.',
              '// cloud3: x cloud march quality scale, y weather type (0 rain/normal, 1 snow, 2 sand/dust),\n    // z weather intensity, w secondary high-cloud coverage.\n    public float4   cloud3;\n    // fog2: x debug mode, y weather type, z weather intensity, w reserved.',
              "world weather lane docs")
          write(path, s)

          # ---- Fog: robust horizon fallback, weather structure, coloured local volumetrics ----------
          path = "shaders/pipelines/world/fog.slang"
          s = text(path)
          s = one(s, 'import bindings;\n', 'import bindings;\nimport lighting;\n', "fog lighting import")
          helper_marker = '''public bool fogActive(FogParams f) {\n    return f.sigma > 0.0;\n}\n'''
          helpers = '''public bool fogActive(FogParams f) {\n    return f.sigma > 0.0;\n}\n\nstatic const int WEATHER_SNOW = 1;\nstatic const int WEATHER_SAND = 2;\n\nfloat weatherFogStructure(WorldPush push, float3 position) {\n    float intensity = clamp(push.fog2.z, 0.0, 1.0);\n    int weatherType = int(round(push.fog2.y));\n    if (intensity <= 0.0 || (weatherType != WEATHER_SNOW && weatherType != WEATHER_SAND)) {\n        return 1.0;\n    }\n    float time = push.waterParams.w;\n    float3 coord;\n    if (weatherType == WEATHER_SAND) {\n        // Broad horizontal sheets moving faster than the cloud deck. One filtered texture fetch gives\n        // a stable density field without per-ray procedural noise or frame-to-frame sparkling.\n        coord = float3((position.x + time * 22.0) * 0.010, position.y * 0.035,\n                       (position.z + time * 8.0) * 0.010);\n    } else {\n        // Snowfall varies more vertically and drifts slowly sideways. This is the participating-medium\n        // component; visible vanilla/particle flakes remain a separate foreground layer.\n        coord = float3((position.x + time * 2.5) * 0.022, (position.y + time * 9.0) * 0.030,\n                       (position.z + time * 1.5) * 0.022);\n    }\n    float n = cloudNoiseTex.SampleLevel(coord, 0.0).x;\n    float structured = weatherType == WEATHER_SAND ? lerp(0.55, 1.55, n) : lerp(0.72, 1.32, n);\n    return lerp(1.0, structured, intensity);\n}\n\nfloat3 applyWeatherFogTint(float3 inscatter, WorldPush push) {\n    float intensity = clamp(push.fog2.z, 0.0, 1.0);\n    int weatherType = int(round(push.fog2.y));\n    if (intensity <= 0.0 || weatherType == 0) {\n        return inscatter;\n    }\n    float3 tint709 = weatherType == WEATHER_SAND\n            ? float3(0.82, 0.50, 0.24) : float3(0.82, 0.90, 1.0);\n    float3 tint = bt709ToAcesCg(tint709);\n    float tintLuma = max(dot(tint, ACESCG_LUMA), 1.0e-5);\n    float strength = intensity * (weatherType == WEATHER_SAND ? 0.78 : 0.38);\n    return lerp(inscatter, inscatter * (tint / tintLuma), strength);\n}\n\n// One nearby emitter sample tints the participating medium around block lights. It intentionally casts\n// no extra visibility ray: the fog term is low-frequency, and adding a shadow query to every path segment\n// would cost more than the visual precision it buys. The light-grid lookup keeps this O(1).\nfloat3 fogLocalLightInscatter(float3 position) {\n    if (pc.lightBufAddr == 0 || pc.lightGridCellAddr == 0 || pc.lightGridSpanAddr == 0\n            || worldPush.lightCount == 0u) {\n        return float3(0.0);\n    }\n    LightGridCell cell;\n    int3 cellCoord;\n    if (!findLightGridCell(position, cell, cellCoord) || cell.spanCount == 0u) {\n        return float3(0.0);\n    }\n    LightGridSpan span = ConstPtr<LightGridSpan>(pc.lightGridSpanAddr)[cell.spanOffset];\n    uint count = span.packedLightCounts & 0xffffu;\n    if (count == 0u || span.firstLight >= worldPush.lightCount) {\n        return float3(0.0);\n    }\n    Light light = ConstPtr<Light>(pc.lightBufAddr)[span.firstLight];\n    float3 lightPos = light.pos + worldPush.lightRebase.xyz;\n    float3 toReceiver = position - lightPos;\n    float dist2 = max(dot(toReceiver, toReceiver), 1.0);\n    float3 dir = toReceiver * rsqrt(dist2);\n    float facing = max(dot(lightGeometricNormal(light), dir), 0.0);\n    if (facing <= 0.0) {\n        return float3(0.0);\n    }\n    float solidAngle = min(lightArea(light) * facing / dist2, 0.35);\n    return lightRadiance(light) * (solidAngle * ISOTROPIC_PHASE);\n}\n'''
          s = one(s, helper_marker, helpers, "fog helper insertion")

          start = s.index('public float3 fogTint(')
          end = s.index('// Fold one travelled segment', start)
          replacement = '''public float3 fogTint(FogParams f, float3 inscatter, WorldPush push) {\n    float strength = clamp(push.dimFog.w, 0.0, 1.0);\n    float3 tinted = inscatter;\n    if (strength > 0.0) {\n        // Hue-only vanilla tint: missing/black environment colour must never remove atmospheric light.\n        float3 tint = bt709ToAcesCg(max(push.dimFog.rgb, float3(0.0)));\n        float tintLuma = dot(tint, ACESCG_LUMA);\n        if (tintLuma > 1.0e-3) {\n            tinted = lerp(tinted, tinted * (tint / tintLuma), strength);\n        }\n    }\n    return applyWeatherFogTint(tinted, push);\n}\n\npublic float3 fogInscatter(FogParams f, float3 rd, SkyState state, WorldPush push) {\n    // The sky-view LUT parameterisation stops at the horizon. Terrain rays often point slightly below\n    // it, so use the nearest valid horizon sample for the scattering direction while retaining the true\n    // light-relative angle. This removes the black lower-border failure without flattening sunset colour.\n    float horizonCos = horizonZenithCos(state.viewerRadiusKm);\n    float lookupZenithCos = max(rd.y, horizonCos + 1.0e-3);\n    float2 sunUv = skyViewLutUv(state.viewerRadiusKm, lookupZenithCos,\n            lightViewCosine(rd, state.sunDir), SKY_VIEW_BODY_SUN);\n    float2 moonUv = skyViewLutUv(state.viewerRadiusKm, lookupZenithCos,\n            lightViewCosine(rd, state.moonDir), SKY_VIEW_BODY_MOON);\n    float3 sky709 = skyViewLut.SampleLevel(sunUv, 0.0).rgb\n            + skyViewLut.SampleLevel(moonUv, 0.0).rgb\n            + float3(state.airglowLuminance);\n    // Defensive edge fallback for an uninitialised/invalid LUT texel. Use the dimension sky colour as a\n    // hue-bearing floor, never black; normal valid LUT samples never take this branch.\n    if (dot(sky709, float3(0.2126, 0.7152, 0.0722)) <= 1.0e-6) {\n        sky709 = max(push.dimSky.rgb, float3(max(state.airglowLuminance, 1.0e-5)));\n    }\n    return bt709ToAcesCg(max(sky709, float3(0.0))) * f.albedo;\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('''// Debug: replace the path's radiance with the raw fog in-scatter colour, so the value can be SEEN\n// rather than inferred. Three fog fixes have now been attempted from reasoning alone and all three\n// were wrong about the cause; this is the cheapest way to find out whether the in-scatter is black\n// (a lookup problem) or bright (a composition problem), which need opposite fixes.''',
                        '''// Debug: replace the path radiance with the raw fog in-scatter colour so LUT/tint state can be\n// inspected directly without the surface behind it.''')
          s = one(s,
              '    L = fogTint(f, fogInscatter(f, rd, state), push);',
              '    L = fogTint(f, fogInscatter(f, rd, state, push), push);',
              "fog debug call")
          s = one(s,
              '''    float tau = fogOpticalDepth(f, ro, rd, t);\n    if (tau <= 0.0) {\n        return;\n    }\n    float transmittance = exp(-tau);\n    L += throughput * fogTint(f, fogInscatter(f, rd, state), push) * (1.0 - transmittance);\n    throughput *= transmittance;''',
              '''    float tau = fogOpticalDepth(f, ro, rd, t);\n    if (tau <= 0.0) {\n        return;\n    }\n    float travel = clamp(t, 0.0, FOG_MAX_DISTANCE);\n    float3 midpoint = ro + rd * (travel * 0.5);\n    tau *= weatherFogStructure(push, midpoint);\n    float transmittance = exp(-tau);\n    float3 inscatter = fogTint(f, fogInscatter(f, rd, state, push), push);\n    inscatter += fogLocalLightInscatter(midpoint) * f.albedo;\n    L += throughput * inscatter * (1.0 - transmittance);\n    throughput *= transmittance;''',
              "fog segment integration")
          write(path, s)

          # ---- Cloud system: texture-backed cumulus + independent altocumulus deck ----------------
          path = "shaders/pipelines/world/clouds.slang"
          s = text(path)
          s = s.replace("A single cumulus deck between cloudBottom and cloudBottom+thickness", "A lower cumulus deck plus an optional higher altocumulus deck")
          old_noise = '''// Density is procedural rather than textured. A 3D noise texture would be the faster answer per sample,\n// but it costs a descriptor binding, a CPU-side bake, and a resource lifetime to manage in RtComposite;\n// the arithmetic version keeps the entire feature inside two shader files plus eight push floats. If this\n// ever becomes the frame's bottleneck, the density function is the single thing to move to a texture and\n// nothing else here changes.\n'''
          s = s.replace(old_noise, '''// Density comes from the precomputed, tiled RtCloudNoise 3D texture. The lower and upper decks reuse\n// that texture at different scales and wind rates, so adding cloud variety costs samples rather than a\n// second volume allocation or descriptor set.\n''')
          s = s.replace('public static const int CLOUD_VIEW_STEPS  = 64;', 'public static const int CLOUD_VIEW_STEPS  = 48;')
          s = s.replace('public static const int CLOUD_LIGHT_STEPS = 6;', 'public static const int CLOUD_LIGHT_STEPS = 5;')
          s = one(s,
              '''    public float quality;      // scales the march step counts; 1 is reference, 0.5 is half the samples\n};''',
              '''    public float quality;      // scales the march step counts; 1 is reference, 0.5 is half the samples\n    public int weatherType;   // 0 ordinary/rain, 1 snow, 2 sand/dust\n    public float weatherIntensity;\n    public float secondaryCoverage; // higher altocumulus deck\n};''',
              "cloud param fields")
          s = one(s,
              '''    c.quality = clamp(push.cloud3.x, 0.1, 1.0);\n    return c;''',
              '''    c.quality = clamp(push.cloud3.x, 0.1, 1.0);\n    c.weatherType = int(round(push.cloud3.y));\n    c.weatherIntensity = clamp(push.cloud3.z, 0.0, 1.0);\n    c.secondaryCoverage = clamp(push.cloud3.w, 0.0, 1.0);\n    return c;''',
              "cloud param unpack")
          cloud_active = '''public bool cloudsActive(CloudParams c) {\n    return c.coverage > 0.0 && c.density > 0.0;\n}\n'''
          cloud_helpers = cloud_active + '''\nCloudParams secondaryCloudParams(CloudParams base) {\n    CloudParams high = base;\n    high.coverage = base.secondaryCoverage;\n    high.density = base.density * (base.weatherType == 1 ? 0.58 : 0.42);\n    high.bottomY = base.bottomY + base.thickness * 1.35;\n    high.thickness = max(base.thickness * 0.34, 20.0);\n    high.wind = base.wind * 1.55 + float2(19.0, -11.0);\n    high.detail = clamp(max(base.detail, 0.62), 0.0, 1.0);\n    high.featureSize = max(base.featureSize * 0.46, 32.0);\n    high.ambient = base.ambient * 1.15;\n    high.quality = max(base.quality * 0.48, 0.22);\n    high.secondaryCoverage = 0.0;\n    if (base.weatherType == 2) {\n        high.coverage *= 0.20;\n    }\n    return high;\n}\n'''
          s = one(s, cloud_active, cloud_helpers, "secondary cloud helper")
          s = one(s,
              'public CloudResult marchClouds(CloudParams c, SkyState state, float3 origin, float3 direction,',
              'CloudResult marchCloudLayer(CloudParams c, SkyState state, float3 origin, float3 direction,',
              "cloud layer rename")
          wrapper = '''\n\npublic CloudResult marchClouds(CloudParams c, SkyState state, float3 origin, float3 direction,\n                               float3 tint709, float tintStrength) {\n    CloudResult low = marchCloudLayer(c, state, origin, direction, tint709, tintStrength);\n    CloudParams highParams = secondaryCloudParams(c);\n    if (!cloudsActive(highParams)) {\n        return low;\n    }\n    CloudResult high = marchCloudLayer(highParams, state, origin, direction, tint709, tintStrength);\n\n    float lowNear, lowFar, highNear, highFar;\n    bool lowHit = cloudsActive(c) && cloudSlabRange(c, origin, direction, lowNear, lowFar);\n    bool highHit = cloudSlabRange(highParams, origin, direction, highNear, highFar);\n    if (!lowHit) return high;\n    if (!highHit) return low;\n\n    CloudResult result;\n    if (lowNear <= highNear) {\n        result.scattering = low.scattering + low.transmittance * high.scattering;\n    } else {\n        result.scattering = high.scattering + high.transmittance * low.scattering;\n    }\n    result.transmittance = low.transmittance * high.transmittance;\n    return result;\n}\n'''
          s = s.rstrip() + wrapper
          write(path, s)

          # ---- POM: keep close-up quality, reduce work as it fades --------------------------------
          path = "shaders/pipelines/world/closest_hit.rchit.slang"
          s = text(path)
          s = one(s,
              '''    if (fade <= 0.0) {\n        return localUv;\n    }\n    float3 T;''',
              '''    float activeDepth = depthScale * fade;\n    if (activeDepth <= 0.0015) {\n        return localUv;\n    }\n    float3 T;''',
              "POM early out")
          s = one(s,
              '''    float2 maxOffset = (viewT.xy / vz) * depthScale * fade;\n\n    // Steps scale with view angle: a steep view crosses little of the height field and needs few\n    // samples, a grazing one crosses a lot and needs many.\n    int steps = int(clamp(lerp(float(POM_MAX_STEPS), 8.0, abs(viewT.z)) * max(pomParams.y, 0.1),\n            4.0, float(POM_MAX_STEPS)));''',
              '''    float2 maxOffset = (viewT.xy / vz) * activeDepth;\n\n    // Preserve the full close-range budget, but shed samples continuously with the same LOD fade that\n    // removes the parallax. Paying 64 samples for a sub-pixel offset near the fade boundary is wasted.\n    float fadeCost = lerp(0.35, 1.0, sqrt(fade));\n    int steps = int(clamp(lerp(float(POM_MAX_STEPS), 8.0, abs(viewT.z))\n            * max(pomParams.y, 0.1) * fadeCost, 4.0, float(POM_MAX_STEPS)));''',
              "POM adaptive steps")
          s = one(s,
              '''    for (int i = 0; i < POM_REFINE_STEPS; ++i) {''',
              '''    int refineSteps = lod < 1.5 ? POM_REFINE_STEPS : 3;\n    for (int i = 0; i < refineSteps; ++i) {''',
              "POM adaptive refinement")
          write(path, s)

          # ---- Distant LOD: cooldown empty DB regions and bound travel residency ------------------
          path = "src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java"
          s = text(path)
          s = one(s,
              '''    /** Keys whose dispatch ended without geometry (empty region, DH miss, or a build failure). */\n    private final List<Long> lodFailed = java.util.Collections.synchronizedList(new ArrayList<>());''',
              '''    /** Keys whose dispatch ended without geometry (empty region, DH miss, or a build failure). */\n    private final List<Long> lodFailed = java.util.Collections.synchronizedList(new ArrayList<>());\n    /** Render-frame deadline before an empty/failed DH region may be queried again. Render-thread only. */\n    private final Long2LongOpenHashMap lodRetryAfterFrame = new Long2LongOpenHashMap();\n    private static final long LOD_RETRY_COOLDOWN_FRAMES = 600L;''',
              "LOD retry fields")
          s = one(s,
              '''        inFlight.defaultReturnValue(NO_TESS_TOKEN);\n        inFlightDirtyGroup.defaultReturnValue(NO_DIRTY_GROUP);''',
              '''        inFlight.defaultReturnValue(NO_TESS_TOKEN);\n        inFlightDirtyGroup.defaultReturnValue(NO_DIRTY_GROUP);\n        lodRetryAfterFrame.defaultReturnValue(0L);''',
              "LOD retry default")
          old_comment = '''    // LOD sections are never individually evicted. They are cheap to hold (a few hundred at most), the\n    // player leaving a region is not a reason to rebuild it, and never destroying a published BLAS\n    // mid-session removes the entire use-after-free class of bug from this path. They are released\n    // wholesale on world change or when the feature is switched off.\n'''
          s = s.replace(old_comment, '''    // LOD residency follows a padded ring around the player. Geometry beyond that ring is retired against\n    // the graphics timeline, bounding memory on long-distance travel while the padding avoids churn at the edge.\n''')
          s = one(s,
              '''        int centreY = Math.floorDiv(62, sectionBlocks);\n\n        // Nearest-first, so the ring the player is looking at fills before the far edge.''',
              '''        int centreY = Math.floorDiv(62, sectionBlocks);\n        evictLodOutside(ctx, centreX, centreZ, sectionBlocks, radius + 2);\n        long frame = RtComposite.frameCounter();\n\n        // Nearest-first, so the ring the player is looking at fills before the far edge.''',
              "LOD eviction call")
          s = one(s,
              '''                        if (lodResident.containsKey(key) || lodInFlight.contains(key)) {\n                            continue;\n                        }\n                        dispatchLodSection''',
              '''                        if (lodResident.containsKey(key) || lodInFlight.contains(key)) {\n                            continue;\n                        }\n                        long retryAfter = lodRetryAfterFrame.get(key);\n                        if (retryAfter > frame) {\n                            continue;\n                        }\n                        lodRetryAfterFrame.remove(key);\n                        dispatchLodSection''',
              "LOD retry gate")
          s = one(s,
              '''            for (Long key : failed) {\n                lodInFlight.remove(key.longValue());\n            }''',
              '''            long retryAfter = RtComposite.frameCounter() + LOD_RETRY_COOLDOWN_FRAMES;\n            for (Long key : failed) {\n                long primitiveKey = key.longValue();\n                lodInFlight.remove(primitiveKey);\n                lodRetryAfterFrame.put(primitiveKey, retryAfter);\n            }''',
              "LOD failure cooldown")
          s = one(s,
              '''        for (PreparedSection ps : batch) {\n            lodInFlight.remove(ps.key());''',
              '''        for (PreparedSection ps : batch) {\n            lodInFlight.remove(ps.key());\n            lodRetryAfterFrame.remove(ps.key());''',
              "LOD success clears cooldown")
          insert_before_release = '''    /**\n     * Drops every LOD section. Used when the feature is switched off and on world teardown.'''
          eviction_method = '''    private void evictLodOutside(RtContext ctx, int centreX, int centreZ,\n                                 int sectionBlocks, int retainRadius) {\n        if (lodResident.isEmpty()) {\n            return;\n        }\n        List<SectionGeom> doomed = new ArrayList<>();\n        var iterator = lodResident.long2ObjectEntrySet().fastIterator();\n        while (iterator.hasNext()) {\n            var entry = iterator.next();\n            SectionGeom g = entry.getValue();\n            int lx = Math.floorDiv(g.sx, sectionBlocks);\n            int lz = Math.floorDiv(g.sz, sectionBlocks);\n            if (Math.max(Math.abs(lx - centreX), Math.abs(lz - centreZ)) <= retainRadius) {\n                continue;\n            }\n            iterator.remove();\n            lodRetryAfterFrame.remove(g.key);\n            if (g.slot >= 0 && g.slot < table.slots.size()) {\n                table.slots.set(g.slot, null);\n                table.freeSlots.add(g.slot);\n            }\n            g.slot = -1;\n            g.instanceIndex = -1;\n            doomed.add(g);\n        }\n        if (doomed.isEmpty()) {\n            return;\n        }\n        table.instanceList.clear();\n        for (int i = 0; i < table.slots.size(); i++) {\n            SectionGeom g = table.slots.get(i);\n            if (g != null) {\n                g.instanceIndex = table.instanceList.size();\n                table.instanceList.add(table.instanceFor(g, blockX, blockY, blockZ));\n            }\n        }\n        table.instances = table.instanceList;\n        retire(ctx, ctx.gpuExecutor().latestGraphicsUse(), doomed);\n    }\n\n'''
          if insert_before_release not in s:
              raise SystemExit("LOD release insertion point missing")
          s = s.replace(insert_before_release, eviction_method + insert_before_release, 1)
          s = one(s,
              '''        lodResident.clear();\n        lodInFlight.clear();''',
              '''        lodResident.clear();\n        lodInFlight.clear();\n        lodRetryAfterFrame.clear();''',
              "LOD release retry clear")
          s = one(s,
              '''            if (g.slot >= 0 && g.slot < table.slots.size()) {\n                table.slots.set(g.slot, null);\n            }\n            g.slot = -1;''',
              '''            if (g.slot >= 0 && g.slot < table.slots.size()) {\n                table.slots.set(g.slot, null);\n                table.freeSlots.add(g.slot);\n            }\n            g.slot = -1;''',
              "LOD release frees slots")
          write(path, s)

          # ---- Look package: stronger but still restrained optical bloom ---------------------------
          path = "src/main/resources/caustica/color/looks/default/look.json"
          s = text(path)
          s = one(s, '"strength": 0.02,', '"strength": 0.032,', "bloom strength")
          s = one(s, '"thresholdSceneLinear": 2.0,', '"thresholdSceneLinear": 1.6,', "bloom threshold")
          s = one(s, '"softKneeFraction": 0.25,', '"softKneeFraction": 0.35,', "bloom knee")
          s = one(s, '"radius": 1.0,', '"radius": 1.08,', "bloom radius")
          write(path, s)

          # Basic invariants before committing.
          if 'ensureCloudNoise(ctx);' not in text('src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java'):
              raise SystemExit('startup cloud-noise fix was lost')
          if 'agx-punchy-hdr' not in text('src/main/java/dev/comfyfluffy/caustica/CausticaConfig.java'):
              raise SystemExit('Punchy HDR mode missing')
          PY

      - name: Commit renderer pass and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/codex-claude-pass.yml
          git add src/main/java/dev/comfyfluffy/caustica/CausticaConfig.java \
                  src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java \
                  src/main/java/dev/comfyfluffy/caustica/rt/pipeline/RtDisplayPipeline.java \
                  src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java \
                  shaders/common/display_common.slang \
                  shaders/pipelines/display/main.comp.slang \
                  shaders/pipelines/world/world_common.slang \
                  shaders/pipelines/world/fog.slang \
                  shaders/pipelines/world/clouds.slang \
                  shaders/pipelines/world/closest_hit.rchit.slang \
                  src/main/resources/caustica/color/looks/default/look.json
          git diff --cached --check
          git commit -m "Complete realism and performance renderer pass"
          git push origin HEAD:codex/claude-pass
