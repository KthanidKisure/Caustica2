name: CausticaLOD lifecycle invalidation cleanup

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-lifecycle.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply lifecycle invalidation cleanup
        run: python3 .github/zz_patch_lod_lifecycle.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/client/CausticaClient.java
          git commit -m "Reset all CausticaLOD sources on lifecycle invalidation"
          git push origin HEAD:codex/claude-pass
