name: CausticaLOD reusable page scratch

on:
  push:
    branches: [codex/post-merge-optimizations]
    paths: [".github/workflows/zz-lod-page-scratch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-optimizations
          fetch-depth: 0
      - name: Apply reusable primitive LOD page grids
        run: python3 .github/zz_patch_lod_page_scratch.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodSource.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodPackedSource.java
          git commit -m "Reuse primitive CausticaLOD page scratch"
          git push origin HEAD:codex/post-merge-optimizations
