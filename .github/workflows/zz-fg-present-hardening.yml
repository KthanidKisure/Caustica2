name: Vulkan FG present hardening

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-fg-present-hardening.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply FG present hardening
        run: python3 .github/zz_patch_fg_present.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/RtFramePresenter.java
          git commit -m "Harden Vulkan frame-generation present path"
          git push origin HEAD:codex/claude-pass
