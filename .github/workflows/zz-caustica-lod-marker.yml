name: CausticaLOD marker hardening

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-lod-marker.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Harden WynnLOD completion marker
        run: python3 .github/zz_patch_lod_marker.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodPackedSource.java
          git commit -m "Harden WynnLOD completion publication"
          git push origin HEAD:codex/claude-pass
