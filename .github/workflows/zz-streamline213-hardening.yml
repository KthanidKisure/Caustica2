name: Streamline 2.13 NGX hardening

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-streamline213-hardening.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Apply NGX/runtime hardening
        run: python3 .github/zz_patch_streamline213.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/ngx/NgxRuntime.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/pipeline/RtDlssRr.java
          git add src/main/java/dev/comfyfluffy/caustica/rt/pipeline/RtDlssFg.java
          git commit -m "Harden NGX lifecycle for newer Streamline runtimes"
          git push origin HEAD:codex/claude-pass
