name: Caustica Slang 1.4.357 fix

on:
  push:
    branches: [codex/claude-pass]
    paths: [".github/workflows/zz-caustica-slang357-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0
      - name: Make cloud slab ranges definitely initialized
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shaders/pipelines/world/clouds.slang')
          s = p.read_text()
          old = '''    float lowNear, lowFar, highNear, highFar;\n    bool lowHit = cloudsActive(c) && cloudSlabRange(c, origin, direction, lowNear, lowFar);\n    bool highHit = cloudSlabRange(highParams, origin, direction, highNear, highFar);\n    if (!lowHit) return high;\n    if (!highHit) return low;'''
          new = '''    // Keep slab outputs on paths where Slang can prove they were assigned. This is equivalent to\n    // the old short-circuit form, but avoids reading an out value whose producer may have been skipped.\n    if (!cloudsActive(c)) return high;\n    float lowNear, lowFar;\n    if (!cloudSlabRange(c, origin, direction, lowNear, lowFar)) return high;\n    float highNear, highFar;\n    if (!cloudSlabRange(highParams, origin, direction, highNear, highFar)) return low;'''
          assert old in s, 'cloud layer ordering site changed unexpectedly'
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add shaders/pipelines/world/clouds.slang
          git commit -m "Fix cloud layer definite initialization"
          git push origin HEAD:codex/claude-pass
