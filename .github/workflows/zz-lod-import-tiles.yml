name: CausticaLOD fixed tile import path

on:
  push:
    branches: [codex/post-merge-optimizations]
    paths: [".github/workflows/zz-lod-import-tiles.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-merge-optimizations
          fetch-depth: 0
      - name: Apply fixed-array WynnLOD conversion
        run: python3 .github/zz_patch_lod_import_tiles.py
      - name: Commit source patch
        run: |
          git config user.name "Caustica CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtCausticaLodImporter.java
          git commit -m "Optimize WynnLOD tile conversion hot path"
          git push origin HEAD:codex/post-merge-optimizations
