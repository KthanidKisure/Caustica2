name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"

env:
  DLSS_SDK_REF: v310.7.0
  DLSS_SDK_PATH: third_party/DLSS
  NGX_SHIM_CONFIG: release
  NGX_VENDOR_CONFIG: rel
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2

jobs:
  apply-rt-init-fix:
    name: Apply RT initialization source fix
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/rt-pipeline-ordering-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Patch RtComposite source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java")
          source = path.read_text(encoding="utf-8")

          premature = (
              "        // Created alongside the other RT resources because this is where ctx is in scope; the method\n"
              "        // itself is idempotent, so a resize re-binds the existing texture rather than regenerating it.\n"
              "        ensureCloudNoise(ctx);\n"
          )
          pipeline_seam = (
              "                    WorldPushConstantsData.BYTE_SIZE, bindlessTextureCapacity);\n"
              "            // Per-frame world data lives in this BDA ring; the pipeline pushes its address and hot fields.\n"
          )
          pipeline_fixed = (
              "                    WorldPushConstantsData.BYTE_SIZE, bindlessTextureCapacity);\n"
              "            // Cloud noise is a descriptor owned by the world pipeline. Create/bind it only after the pipeline\n"
              "            // exists; recreating the pipeline simply rebinds the device-lifetime texture and sampler.\n"
              "            ensureCloudNoise(ctx);\n"
              "            // Per-frame world data lives in this BDA ring; the pipeline pushes its address and hot fields.\n"
          )
          destroy_seam = (
              "        if (worldPipeline != null) {\n"
              "            worldPipeline.destroy();\n"
              "            worldPipeline = null;\n"
              "        }\n"
              "        bindlessTextureCapacity = 0;\n"
          )
          destroy_fixed = (
              "        if (worldPipeline != null) {\n"
              "            worldPipeline.destroy();\n"
              "            worldPipeline = null;\n"
              "        }\n"
              "        if (cloudNoise != null) {\n"
              "            cloudNoise.destroy();\n"
              "            cloudNoise = null;\n"
              "        }\n"
              "        if (cloudNoiseSampler != 0L) {\n"
              "            RtContext ctx = RtContext.currentOrNull();\n"
              "            if (ctx != null) {\n"
              "                VK10.vkDestroySampler(ctx.vk(), cloudNoiseSampler, null);\n"
              "            }\n"
              "            cloudNoiseSampler = 0L;\n"
              "        }\n"
              "        bindlessTextureCapacity = 0;\n"
          )

          if premature in source:
              if source.count(premature) != 1 or source.count(pipeline_seam) != 1 or source.count(destroy_seam) != 1:
                  raise SystemExit("RtComposite source shape changed; refusing an ambiguous patch")
              source = source.replace(premature, "", 1)
              source = source.replace(pipeline_seam, pipeline_fixed, 1)
              source = source.replace(destroy_seam, destroy_fixed, 1)
              path.write_text(source, encoding="utf-8")
          elif source.count("ensureCloudNoise(ctx);") != 1:
              raise SystemExit("unexpected cloud-noise initialization state")
          PY

      - name: Commit source fix when needed
        run: |
          if git diff --quiet -- src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java; then
            echo "Source fix already applied"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/RtComposite.java
          git commit -m "Fix cloud noise pipeline initialization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  native-windows:
    name: Build Windows NGX shim
    runs-on: windows-2022

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure NGX shim
        shell: pwsh
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build NGX shim
        shell: pwsh
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Windows NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-windows-x64
          path: build/native/ngx_shim/release/ngxshim.dll
          if-no-files-found: error

  native-linux:
    name: Build Linux NGX shim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev

      - name: Configure NGX shim
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
          VULKAN_SDK: /usr
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build NGX shim
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Linux NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-linux-x64
          path: build/native/ngx_shim/release/libngxshim.so
          if-no-files-found: error

  package:
    name: Build bundled mod jar
    runs-on: ubuntu-latest
    needs:
      - native-windows
      - native-linux

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan SDK shader tools
        run: |
          archive="vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/${archive}"
          sdk_root="${RUNNER_TEMP}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"

          curl --fail --location --retry 3 --retry-delay 5 --output "${archive}" "${url}"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
          tar -xf "${archive}" -C "${RUNNER_TEMP}/vulkan-sdk"

          echo "VULKAN_SDK=${sdk_root}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/bin" >> "${GITHUB_PATH}"
          "${sdk_root}/bin/glslangValidator" --version
          "${sdk_root}/bin/slangc" -version
          "${sdk_root}/bin/spirv-val" --version

      - name: Download NGX shims
        uses: actions/download-artifact@v4
        with:
          pattern: ngxshim-*
          path: build/native/ngx_shim/release
          merge-multiple: true

      - name: Build bundled jar
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          bash ./gradlew build
          -PngxPlatforms=windows-x64,linux-x64
          -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }}
          -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }}

      - name: Upload bundled jar
        uses: actions/upload-artifact@v4
        with:
          name: caustica-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
