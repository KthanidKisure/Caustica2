name: LOD transient hotfix

on:
  push:
    branches:
      - codex/claude-pass
    paths:
      - ".github/workflows/lod-transient-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/claude-pass
          fetch-depth: 0

      - name: Apply transient DH query fix
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return out

          # DH source: failed API call != successful empty terrain.
          p = Path("src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtDhLodSource.java")
          s = p.read_text(encoding="utf-8")
          insert = '''    /**
           * Result of one DH terrain request. Successful queries may legitimately contain zero boxes;
           * failed/lifecycle queries are retryable and must never be cached as empty terrain.
           */
          public record FetchResult(List<LodBox> boxes, boolean querySucceeded) {
              public FetchResult {
                  boxes = List.copyOf(boxes);
              }
          }

          '''
          anchor = s.index("True only when the reflected API is present AND DH says its world is actually loaded.")
          comment = s.rfind("    /**", 0, anchor)
          if comment < 0:
              raise SystemExit("available() javadoc not found")
          s = s[:comment] + insert + s[comment:]
          s = sub1(s, r"public static List<LodBox> fetchArea\(", "public static FetchResult fetchArea(", "fetchArea type")
          s = sub1(s, r"private static List<LodBox> fetchRegion\(", "private static FetchResult fetchRegion(", "fetchRegion type")

          a = s.index("private static FetchResult fetchRegion(")
          b = s.index("/** Walks the [x][z][column] array returned by DH. */", a)
          r = s[a:b]
          failed = r.count("return List.of();")
          if failed < 3:
              raise SystemExit(f"expected >=3 failed fetch returns, got {failed}")
          r = r.replace("return List.of();", "return new FetchResult(List.of(), false);")
          r = sub1(r, r"return\s+boxes;", "return new FetchResult(boxes, true);", "nonempty query success")
          r = sub1(r, r"return\s+successfulEmpty;", "return new FetchResult(successfulEmpty, true);", "empty query success")
          s = s[:a] + r + s[b:]
          p.write_text(s, encoding="utf-8")

          # Terrain streamer: transient query failures are released quickly and globally backed off.
          p = Path("src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java")
          t = p.read_text(encoding="utf-8")

          t = sub1(t,
              r"(\s*private final List<Long> lodFailed = java\.util\.Collections\.synchronizedList\(new ArrayList<>\(\)\);)",
              r"\1\n    /** Failed DH API/lifecycle queries: retry soon; never poison the long empty-region cache. */\n    private final List<Long> lodRetrySoon = java.util.Collections.synchronizedList(new ArrayList<>());",
              "lodRetrySoon field")
          t = sub1(t,
              r"(\s*private static final long LOD_RETRY_COOLDOWN_FRAMES = 600L;)",
              r"\1\n    private static final long LOD_TRANSIENT_RETRY_NANOS = 1_000_000_000L;\n    private long lodSourceRetryAfterNanos;",
              "transient backoff fields")
          t = sub1(t,
              r"(\s*publishLodPrepared\(ctx, pbx, pby, pbz\);)\s*\n(\s*int detail = CausticaConfig\.Rt\.Lod\.DETAIL\.value\(\);)",
              r"\1\n        if (System.nanoTime() < lodSourceRetryAfterNanos) {\n            return;\n        }\n\n\2",
              "dispatch backoff gate")

          worker_pattern = (r"java\.util\.List<RtDhLodSource\.LodBox>\s+boxes\s*=\s*"
                            r"RtDhLodSource\.fetchArea\(sectionBlocks,\s*originX,\s*originZ\);")
          worker_repl = '''RtDhLodSource.FetchResult fetched = RtDhLodSource.fetchArea(sectionBlocks, originX, originZ);
                  if (!fetched.querySucceeded()) {
                      finishLodRetrySoon(key);
                      return;
                  }
                  java.util.List<RtDhLodSource.LodBox> boxes = fetched.boxes();'''
          t = sub1(t, worker_pattern, worker_repl, "typed worker query")

          method = '''    private void finishLodRetrySoon(long key) {
              lodRetrySoon.add(key);
              finishActiveTask();
          }

          '''
          marker = "    /** Publishes finished LOD sections into the shared section table. */"
          if marker not in t:
              raise SystemExit("publish marker missing")
          t = t.replace(marker, method + marker, 1)

          sig = "    private void publishLodPrepared(RtContext ctx, int pbx, int pby, int pbz) {"
          transient = '''
              // A rejected DH call is a source lifecycle problem, not an empty terrain result.
              if (!lodRetrySoon.isEmpty()) {
                  List<Long> retrySoon;
                  synchronized (lodRetrySoon) {
                      retrySoon = new ArrayList<>(lodRetrySoon);
                      lodRetrySoon.clear();
                  }
                  for (Long key : retrySoon) {
                      lodInFlight.remove(key.longValue());
                  }
                  lodSourceRetryAfterNanos = System.nanoTime() + LOD_TRANSIENT_RETRY_NANOS;
                  CausticaMod.LOGGER.info(
                          "LOD: DH source not query-ready; retrying in 1 second ({} regions deferred)",
                          retrySoon.size());
              }
          '''
          if sig not in t:
              raise SystemExit("publish method signature missing")
          t = t.replace(sig, sig + transient, 1)
          p.write_text(t, encoding="utf-8")

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtDhLodSource.java \
                  src/main/java/dev/comfyfluffy/caustica/rt/terrain/RtTerrain.java
          git diff --cached --check
          git commit -m "Treat DH pre-world query failures as transient"
          git push origin HEAD:codex/claude-pass
